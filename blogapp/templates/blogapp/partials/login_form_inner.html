<h3 style="font-size: 1.3rem; margin-bottom: 1rem;">Login</h3>
<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="fluid-btn" style="background: #2563eb; color: white;">Sign In</button>
</form>

<p style="font-size: 0.85rem; margin-top: 1rem;">
    New here? <a href="#" hx-get="{% url 'htmx_signup_form' %}" hx-target="#modal-dynamic-content">Create an account</a>
</p>
