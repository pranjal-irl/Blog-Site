<!DOCTYPE html>

<html>

<head>

    <title>My Blog</title>
</head>

<body>
    <h1>My Articles</h1>

    {% for article in articles %}
        <h2>{{ article.title }}</h2>
        <p>{{ article.created_at }}</p>
    {% empty %}
        <p>There is now article currently.</p>
    {% endfor %}
</body>
</html>
