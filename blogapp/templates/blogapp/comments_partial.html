<h3>Comments</h3>
        <div id="comments-list">
            {% for comment in article.comments.all %}
                <div style="border-bottom: 1px solid #eee; margin-bottom: 10px; padding-bottom: 5px;">
                    <strong>{{ comment.name }}</strong><small style="color: grey;">({{ comment.created_at|date:"d M Y"}})</small>
                    <p>{{ comment.body }}</p>
                </div>
            {% empty %}
                <p id="no-comments">There are no comments yet. Be the first one to comment!</p>
            {% endfor %}
            </div>

            <hr>

            <h4>Add a Comment</h4>
            <form hx-post="/article/{{ article.slug }}/comment/"
                hx-target="#comment-section"
                hx-swap="innerHTML">
                {% csrf_token %}
                <div>
                    <label>Name:</label><br>
                    <input type="text" name="name" required style="width: 100%; margin-bottom: 10px;">
                </div>
                <div>
                    <label>Comment:</label><br>
                    <textarea name="body" required style="width: 100; height: 80px; margin-bottom: 10px;"></textarea>
                </div>
                <button type="submit">Submit Comment</button>
            </form>
