{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response HTMX Blog</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' style="margin: 0; padding: 0; font-family: sans-serif; min-height: 100vh; background-color: #f9fafb; position: relative;">

    {% block content %}
    {% endblock %}
 
        {% if not request.user.is_authenticated and not request.session.guest_accepted %}
            <div id="main-auth-modal" class="modal-overlay" style="display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        {% else %}
            <div id="main-auth-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        {% endif %}

        <div class="modal-box" id="modal-dynamic-content"
            style="background: white; padding: 2rem; border-radius: 12px; width: 90vw; max-width: 450px;
                max-height: 82vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); text-align: center;">
            {% include 'blogapp/partials/welcome_modal_inner.html' %}
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (localStorage.getItem('guest_session_active') === 'true') {
                const modal = document.getElementById('main-auth-modal');
                if (modal) modal.style.display = 'none';
            }
        });
    </script>

    <style>
        .modal-box .helptext{
            display: block;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.2rem;
            margin-top: 0.8rem;
            line-height: 1.3;;
        }

        .modal-box input {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.3rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>

</body>
</html>
